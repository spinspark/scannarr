[package]
name = "scannarr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = {version = "4.6", features = ["derive", "env"]}
dirs = "7.0"
secrecy = { version = "0.10", features = ["serde"] }
serde = {version = "1.0", features = ["derive"]}
tokio = {version = "1", features = ["macros", "rt-multi-thread"]}
toml = "0.8"
reqwest = { version = "0.13", features = ["json"] }
